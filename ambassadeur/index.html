<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF4E6">
<title>Relève</title>
<link rel="icon" href="../icone.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!--
  Le lien « Ambassadeur » (moment Ambassadeur, M1, 18 novembre 2026).
  Sur un téléphone où Relève est installée, ce lien n'arrive jamais ici : l'iPhone et Android l'ouvrent
  directement dans Relève (liens vérifiés, fichiers /.well-known/ du dépôt Cerenus-Surenec.github.io).
  Sinon (Relève pas installée, ordinateur), cette page renvoie tout de suite vers
  la page d'installation habituelle, SANS le jeton ni le mot : elle ne lit pas ce qui suit le « # », ne
  l'envoie à personne, et l'efface de l'adresse et de l'historique avant de partir.
  Charger cette page (ou son aperçu dans une messagerie) ne consomme rien : seul le toucher sur « Ouvrir »,
  dans Relève, donne le statut. Aucune ressource externe, aucun traceur.
  Dans le navigateur intégré d'une messagerie, sur un téléphone, elle reste et affiche M1-c (voir le script).
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Relève">
<meta property="og:title" content="Un mot pour toi">
<meta property="og:description" content="Ouvre ce lien sur ton téléphone, dans Relève.">
<meta property="og:url" content="https://cerenus-surenec.github.io/releve-web/ambassadeur">
<meta property="og:image" content="https://cerenus-surenec.github.io/releve-web/icone.png">
<meta property="og:image:width" content="192">
<meta property="og:image:height" content="192">
<meta property="og:image:alt" content="Icône de Relève">
<meta property="og:locale" content="fr_CA">
<meta name="twitter:card" content="summary">
<style>
:root{--creme:#FFF4E6;--nuit:#121A38;--gris:#4A4766}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--creme);color:var(--nuit)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{display:none;min-height:100vh;min-height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding:calc(48px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom))}
.integre main{display:flex}
.icone{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(18,26,56,.18)}
.bandeau{margin:0;padding:16px 18px;border-radius:18px;background:var(--nuit);color:var(--creme);font-size:17px;line-height:1.45;font-weight:700}
.bouton{display:flex;align-items:center;justify-content:center;min-height:60px;margin-top:auto;padding:0 20px;border-radius:30px;
  background:var(--nuit);color:var(--creme);font-size:18px;font-weight:800;text-decoration:none}
</style>
<script>
  // M1-c (texte approuvé le 18 novembre 2026, 18 h 55) : dans le navigateur intégré d'une messagerie
  // (Messenger, Facebook, Instagram), le téléphone n'ouvre souvent pas Relève. On reste alors sur cette page,
  // SANS effacer l'adresse (elle doit garder son « # » pour s'ouvrir dans Safari ou Chrome, puis dans Relève),
  // et on dit quoi faire. Partout ailleurs : on efface le « # … » de l'adresse et de l'historique, puis on va à la
  // page d'installation habituelle. La page ne lit jamais ce qui suit le « # » et ne l'envoie à personne.
  var ua = navigator.userAgent || '';
  var integre = /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram/i.test(ua);
  var telephone = /iPhone|iPad|iPod|Android/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (integre && telephone) {
    document.documentElement.className = 'integre';
  } else {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    location.replace('../');
  }
</script>
<noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body>
<main>
  <img class="icone" src="../apple-touch-icon.png" alt="Icône de Relève" width="84" height="84">
  <p class="bandeau" role="note">Tu as déjà Relève ? Ouvre ce lien dans Safari (ou Chrome) pour qu’il s’ouvre dans l’app.</p>
  <a class="bouton" href="../">Installer Relève</a>
</main>
</body>
</html>
